<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Crisp drop filter for document & shield -->
    <filter id="subtle-shadow" x="-5%" y="-5%" width="115%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Central Scale Structure -->
  <g id="scale-structure" fill="#0c2340" stroke="#0c2340">
    <!-- Fulcrum Top Circle -->
    <circle cx="250" cy="110" r="14" fill="#ffffff" stroke="#0c2340" stroke-width="8" />

    <!-- Central Pillar -->
    <path d="M 244 124 L 256 124 L 260 210 L 240 210 Z" fill="#0c2340" stroke="none" />

    <!-- Scale Horizontal Beam -->
    <path d="M 160 132 L 240 120 L 260 120 L 340 132" fill="none" stroke="#0c2340" stroke-width="7" stroke-linecap="round" />

    <!-- Left Hook Ring -->
    <circle cx="160" cy="133" r="7" fill="#ffffff" stroke="#0c2340" stroke-width="5" />

    <!-- Right Hook Ring -->
    <circle cx="340" cy="133" r="7" fill="#ffffff" stroke="#0c2340" stroke-width="5" />

    <!-- Left Suspension Strings -->
    <line x1="158" y1="139" x2="118" y2="225" stroke="#0c2340" stroke-width="4.5" stroke-linecap="round" />
    <line x1="162" y1="139" x2="202" y2="225" stroke="#0c2340" stroke-width="4.5" stroke-linecap="round" />

    <!-- Right Suspension Strings -->
    <line x1="338" y1="139" x2="298" y2="225" stroke="#0c2340" stroke-width="4.5" stroke-linecap="round" />
    <line x1="342" y1="139" x2="382" y2="225" stroke="#0c2340" stroke-width="4.5" stroke-linecap="round" />

    <!-- Left Scale Pan Bowl -->
    <path d="M 118 225 Q 160 258 202 225 Z" fill="#0c2340" stroke="#0c2340" stroke-width="2" stroke-linejoin="round" />

    <!-- Right Scale Pan Bowl -->
    <path d="M 298 225 Q 340 258 382 225 Z" fill="#0c2340" stroke="#0c2340" stroke-width="2" stroke-linejoin="round" />
  </g>

  <!-- Left Pan Content: Standard Calibration Weight -->
  <g id="standard-weight" fill="#0c2340">
    <!-- Weight Top Knob -->
    <path d="M 154 172 Q 160 166 166 172 L 165 178 L 155 178 Z" />
    <!-- Weight Neck -->
    <rect x="156" y="177" width="8" height="4" />
    <!-- Weight Conical Body -->
    <path d="M 152 181 L 168 181 L 174 214 Q 160 216 146 214 Z" />
  </g>

  <!-- Right Pan Content: Dial Gauge / Meter -->
  <g id="dial-gauge">
    <!-- Outer Gauge Circle -->
    <circle cx="340" cy="192" r="30" fill="#ffffff" stroke="#0c2340" stroke-width="5" />
    <!-- Center Pivot Pin -->
    <circle cx="340" cy="196" r="3" fill="#0c2340" />
    <!-- Gauge Dial Needle pointing to 2 o'clock -->
    <line x1="340" y1="196" x2="354" y2="182" stroke="#16a34a" stroke-width="3" stroke-linecap="round" />
    <!-- Dial Perimeter Tick Marks -->
    <line x1="340" y1="168" x2="340" y2="173" stroke="#0c2340" stroke-width="2" stroke-linecap="round" />
    <line x1="357" y1="175" x2="353" y2="179" stroke="#0c2340" stroke-width="2" stroke-linecap="round" />
    <line x1="364" y1="192" x2="359" y2="192" stroke="#0c2340" stroke-width="2" stroke-linecap="round" />
    <line x1="323" y1="175" x2="327" y2="179" stroke="#0c2340" stroke-width="2" stroke-linecap="round" />
    <line x1="316" y1="192" x2="321" y2="192" stroke="#0c2340" stroke-width="2" stroke-linecap="round" />
    <line x1="327" y1="209" x2="331" y2="205" stroke="#0c2340" stroke-width="2" stroke-linecap="round" />
    <line x1="353" y1="209" x2="349" y2="205" stroke="#0c2340" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Central Verification Document -->
  <g id="verification-document" filter="url(#subtle-shadow)">
    <!-- Document White Body with folded corner -->
    <path d="M 210 185 L 265 185 L 290 210 L 290 295 L 210 295 Z" fill="#ffffff" stroke="#0c2340" stroke-width="6" stroke-linejoin="round" />
    <!-- Corner Fold -->
    <path d="M 265 185 L 265 210 L 290 210" fill="#ffffff" stroke="#0c2340" stroke-width="5" stroke-linejoin="round" />

    <!-- 3 Green Checkmarks & Test Lines -->
    <!-- Item 1 -->
    <path d="M 222 225 L 227 230 L 236 220" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="244" y1="225" x2="274" y2="225" stroke="#0c2340" stroke-width="4.5" stroke-linecap="round" />

    <!-- Item 2 -->
    <path d="M 222 247 L 227 252 L 236 242" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="244" y1="247" x2="274" y2="247" stroke="#0c2340" stroke-width="4.5" stroke-linecap="round" />

    <!-- Item 3 -->
    <path d="M 222 269 L 227 274 L 236 264" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="244" y1="269" x2="260" y2="269" stroke="#0c2340" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- Security Verification Shield at bottom-right of document -->
  <g id="verification-shield" filter="url(#subtle-shadow)">
    <!-- Shield Path -->
    <path d="M 272 255 L 295 250 L 318 255 C 318 285 295 305 295 312 C 295 305 272 285 272 255 Z" fill="#16a34a" stroke="#15803d" stroke-width="3" stroke-linejoin="round" />
    <!-- White Checkmark in Shield -->
    <path d="M 284 278 L 292 286 L 306 270" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography: EXACT Match to user logo -->
  <!-- Line 1: LEGAL METROLOGY -->
  <text x="250" y="360" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="33" letter-spacing="2" fill="#0c2340">LEGAL METROLOGY</text>

  <!-- Line 2: — VERIFICATION & CERTIFICATION — -->
  <g id="sub-heading">
    <line x1="90" y1="386" x2="125" y2="386" stroke="#16a34a" stroke-width="3" stroke-linecap="round" />
    <text x="250" y="391" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="14" letter-spacing="1.5" fill="#16a34a">VERIFICATION &amp; CERTIFICATION</text>
    <line x1="375" y1="386" x2="410" y2="386" stroke="#16a34a" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Line 3: ACCURATE • TRUSTED • COMPLIANT -->
  <text x="250" y="415" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="11.5" letter-spacing="2.5" fill="#0c2340">ACCURATE  •  TRUSTED  •  COMPLIANT</text>
</svg>
