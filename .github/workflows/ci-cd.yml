name: Legal Metrology Suite CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Lint & Type-Check (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript Type Safety
        run: npx tsc --noEmit

      - name: Build Full Production Artifacts (Vite + Node/Express)
        run: npm run build
        env:
          NODE_ENV: production

  deploy:
    name: Production Deployment (CD)
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Deploy Confirmation & Status Output
        run: |
          echo "🚀 CI/CD Build and Type Check Succeeded!"
          echo "📦 Production artifacts compiled and ready for hosting."
